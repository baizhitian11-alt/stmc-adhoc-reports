<script>const REPORT_MD = "# 谷雨 top 贵妇霜素材\n\n本报告基于 18 条素材的单条解析结果做二阶归纳。需要先说明数据口径：这批素材只回传了**消耗**与**增长量**两个指标，没有 CTR、完播率、ROI 等效率数据，因此下文不做效率绝对值判断，只用消耗代表跑量规模、用增长量代表消耗环比动能做相对排序；内容侧结论主要来自 12 条有解析的素材，#1 #2 #5 #7 #8 #13 六条无内容解析，仅按指标与时序讨论，不对其脚本做任何推测。全篇主线是**可复用的创意框架**，而非单条素材点评。\n\n## 📊 一、整体画像\n\n这批素材的消耗区间为 0.26–0.53，头部四条的消耗依次是 #1（0.53）、#2（0.52）、#3（0.51）、#4（0.48），尾部集中在 0.26–0.32。增长量则高度集中在 260–277 的窄带内，说明多数素材处在同一投放水位上，真正拉开差距的是少数异常值：正向最高的是 #9（276.8）、#13（276.4）、#12（274.8），负向的四条是 #8（-17.4）、#10（-25.5）、#11（-21.1）、#16（-25.3）。**消耗高不等于增长高**，#1 #2 消耗排前二但增长量只是中位水平，说明它们更像是长期稳定跑量的“底盘素材”，而不是新起量的爆发素材。\n\n从开篇类型看，12 条有解析的素材里达人开篇与痛点对比各占 4 条，是绝对主力；剧情反转 2 条，产品展示与营销福利各 1 条。商品卖点清晰地分成两条线：底妆/素颜霜线主打遮瑕、卡粉、卡纹、脱妆、水光肌、粉底液显老，对应 #3 #4 #12 #14 #15 #17 #18；抗老淡斑面霜线主打垮脸、皱纹、黑斑、黄黑皮、熬夜蜡黄，对应 #6 #9 #11 #16；#10 #18 两条线兼有。人群以 30–45 岁熟龄女性为主（#4 #10 #11 #14 #15 #17，常见珍珠首饰、知性贵气形象），20–35 岁素人或博主为辅（#6 #9 #12 #16 #18）。场景上，居家梳妆台/洗手台是基本盘，向外扩展到通勤（车内、街头、咖啡馆）、柜台与直播间、高端出行（#3 机场与机舱）、餐厅与火锅店开箱（#11）。\n\n| 开篇一级类型 | 条数 | 素材 | 消耗区间 | 增长量表现 |\n|---|---|---|---|---|\n| 达人开篇 | 4 | #4 #14 #15 #18 | 0.28–0.48 | 全部为正 |\n| 痛点对比 | 4 | #9 #12 #16 #17 | 0.26–0.37 | #16 为负 |\n| 剧情反转 | 2 | #3 #10 | 0.34–0.51 | #10 为负 |\n| 产品展示 | 1 | #6 | 0.44 | 正 |\n| 营销福利 | 1 | #11 | 0.34 | 负 |\n| 无解析 | 6 | #1 #2 #5 #7 #8 #13 | 0.27–0.53 | #8 为负 |\n\n## 🔥 二、共性归因\n\n- ✅ **熟龄同龄达人做信任底座**：30–45 岁、带珍珠首饰、气质知性的女性出镜，配合“我今年 40 岁”“中年女人”这类自我标注，把“她和我一样”的代入感前置（#4 #14 #15 #17）。这是全批最稳定的共性，四条达人开篇素材增长量全部为正。\n- ✅ **痛点必须具体到可指认的细节**：不说“皮肤不好”，而说“卡粉卡纹”“斑驳脱妆”“大黑斑”“黄黑皮”“不画高光没精神”“早起不想化妆”，痛点颗粒度越细，评论区共鸣越强（#4 #9 #14 #15 #17 #18）。\n- ✅ **15 秒内必须出现一次“看得见的变化”**：擦拭见效、抗摩擦、手背或手臂前后对比、多人轮番上脸，是全批最高频的效果呈现方式（#3 #9 #12 #14 #16 #17）。点击峰值集中在 12–15s 正是这一段，#9 在 13s 达到 14.0，为全批最高。\n- ✅ **居家场景打底、多场景拼接做真实感**：梳妆台、洗手台、玄关出门是通用底板，再叠加车内、街头、咖啡馆、柜台、直播间，用场景切换弱化硬广（#4 #12 #14 #15 #17 #18）。\n- ✅ **明星同款背书做临门一脚**：秦岚、肖涵出现在 #10 #14 #17，温峥嵘出现在 #17，通常放在中后段，用来把“素人可信”升级为“明星也在用”。\n- ✅ **两条卖点线话术同源、可互换**：底妆线与淡斑线共用同一套焦虑话术——“水乳留给十几岁小姑娘”“30 岁断崖式衰老”在 #6 #11 出现，底妆线则换成“粉底液显老”，本质都是把年龄焦虑转成产品必要性。\n- ✅ **开篇 1–3 秒完成注意力锁定**：18 条素材的点赞峰值几乎全部落在 1–3s，说明这批素材的开篇抓人能力普遍过关，差异不在“能不能留住”，而在“留住之后接不接得住”。\n\n### 🧩 跑量脚本通用框架\n\n把 12 条有解析素材的脚本拆开对齐后，可以得到一个高度可复用的五段式结构：\n\n| 时间段 | 段落任务 | 常用手法 | 样例素材 |\n|---|---|---|---|\n| 0–3s | 锁定注意力，抛出冲突或身份 | 同龄达人自报年龄、剧情冲突、萌宠/微缩模型、错误用法纠错 | #4 #10 #12 #6 #3 |\n| 3–8s | 放大痛点，把焦虑说具体 | 卡粉卡纹、斑黄暗沉、垮脸松弛、早起没时间 | #4 #9 #15 #18 |\n| 8–15s | 即时实测，给出可见变化 | 擦拭见效、抗摩擦、手背/手臂对比、上脸前后 | #3 #9 #12 #14 #16 #17 |\n| 15s 之后 | 多人多场景验证 + 明星或专业背书 | 多达人轮番上脸、场景切换、秦岚/肖涵/温峥嵘同款 | #10 #14 #17 #18 |\n| 收尾 | 转化引导 | 价格悬念、礼盒、限时福利、评论区引导 | #11 #12 #17 |\n\n这个框架的价值在于：**8–15s 的实测段是整条素材的“承重墙”**，前两段负责把人留住，后两段负责把人说服，一旦实测段被推迟到 20s 之后，链路就会变长、流失就会提前。\n\n## ⚡ 三、开篇钩子分析\n\n### 3.1 达人开篇（4 条，全部正增长）\n\n#4 用 40–50 岁红亮片上衣的中年女性做“擦拭实测口播”，年龄与目标用户几乎重合；#14 走“达人实测 + 抗摩擦水光肌”，后接秦岚、肖涵；#15 直接开口“我今年 40 岁”，把身份标签当钩子；#18 用居家出门 vlog 的懒人口播切入“起晚没时间化妆”。这一类的共同点是**先给身份、再给痛点**，不需要剧情铺垫，起量稳定，是这批素材里风险最低的开篇。\n\n### 3.2 痛点对比（4 条，3 正 1 负）\n\n#9 用多位素人感达人轮番出镜打“大黑斑、黄黑皮”，并配反向承诺；#12 用 CG 小水獭当柜员，拿粉底液做反面对照；#17 用产品堆叠 + 手背斑点对比；#16 用用法对比图 + 肤质特写。这一类钩子最“直给”，但也最依赖实测段承接——#16 点击峰值出现在 2s（5.6），最大流失却在 6s，属于前面很冲、后面接不住。\n\n### 3.3 剧情反转（2 条，1 正 1 负）\n\n#3 是机场偶遇 + 外籍金发模特 + 手臂红斑擦拭消失，异域感与冲突感兼具，消耗排到第 3；#10 是东北夫妻猜疑 + 素颜反转，接地气但铺垫过长，点击峰值被推到 52s、最大流失在 21s，增长量为 -25.5。剧情类的通病是**回报出现得太晚**，#3 的点击峰值甚至在 79s。\n\n### 3.4 产品展示与营销福利（各 1 条）\n\n#6 用微缩医生模型 + “抗皱面霜错误用法”纠错，猎奇感强、专业感足，消耗 0.44 属中上；#11 用价格悬念 + 礼盒开箱，但最大流失出现在 4s（101.1），是全批最早的流失点，说明**福利前置留不住人**。\n\n| 开篇类型 | 钩子强度 | 承接难度 | 增长表现 | 结论 |\n|---|---|---|---|---|\n| 达人开篇 | 中高 | 低 | 全正 | 基本盘，优先复制 |\n| 痛点对比 | 高 | 中 | 3 正 1 负 | 需配 15s 内实测 |\n| 剧情反转 | 高 | 高 | 1 正 1 负 | 必须压缩铺垫 |\n| 产品展示 | 中高 | 低 | 正 | 猎奇可加投 |\n| 营销福利 | 中 | 高 | 负 | 福利后置 |\n\n## 💎 四、表达手法\n\n### 4.1 即时实测与前后对比\n\n这是全批使用密度最高的手法，形态包括擦拭见效（#3）、抗摩擦（#14）、手背/手臂斑点对比（#17）、多人轮番上脸（#9 #12）、晚涂早起（#16）。它的作用不是“证明有效”，而是**在 15s 内制造一个可截图的变化瞬间**，为后面的转化提供视觉证据。\n\n### 4.2 反向承诺与纠错话术\n\n#9 的“如果不能淡化……你也不要用它”是全批最强的一句反向承诺，用自我设限换取信任；#6 的“水乳留给十几岁小姑娘”“怕脸垮得太慢”属于反常规认知纠错，先否定用户的现有做法，再给出替代方案。这类话术的共同点是**先制造认知冲突，再提供解法**，比单纯罗列卖点更容易被记住。\n\n### 4.3 去硬广符号\n\n三种做法：CG 萌宠（#12 的小水獭柜员）、微缩模型（#6 的微缩医生）、异域模特（#3 的外籍金发模特 + 亚裔时尚女性组合）。目的都是在前 3 秒降低“这是广告”的判定。#12 的最大流失值 93.1 是全批最低，说明萌宠柜员的软性开场确实压住了跳出。\n\n### 4.4 明星背书与多人验证\n\n明星通常不放在开头，而是放在 15s 之后作为“信任加码”（#10 #14 #17），前面用素人或同龄达人建立“她和我一样”，后面用明星完成“她都在用”。多人轮番上脸则解决“一个人说好不算好”的疑虑，是达人开篇类的标配。\n\n## 🎯 五、CTA 分析\n\n需要说明：本批解析结果中的 CTA 字段被截断，无法直接读取完整话术，因此本章的 CTA 分类是**根据可见的脚本线索（价格悬念、礼盒开箱、评论区引导、福利话术）结合点击峰值出现的位置反推**得出的，属于推断而非原始标注。\n\n### 5.1 实测后置转化型（主流）\n\n大多数素材把转化动作放在实测段之后，点击峰值集中在 12–15s 就是证据：#4 在 12s（13.6）、#9 在 13s（14.0）、#17 在 12s（9.6）、#18 在 14s（8.1）、#12 与 #15 在 15s。这类 CTA 的逻辑是“先看到效果，再谈购买”，转化路径最短，也最稳。\n\n### 5.2 悬念价格型\n\n#11 用价格悬念 + 礼盒开箱做钩子，把福利信息前置，但最大流失出现在 4s，说明用户在被“卖”之前就离开了。这类 CTA 更适合放在 20s 之后，作为已建立信任后的收口。\n\n### 5.3 长链路口碑型\n\n#1 #2 的点击峰值分别在 31s 和 24s，明显晚于其他素材，但消耗排在全批前二。这说明**长转化链路同样能跑量**，只是它依赖更长的说服过程，不适合用短素材的逻辑去评判。\n\n## 💡 六、差异化机会点\n\n**① 反常规纠错 + 猎奇专业形象（#6）与萌宠/CG 去硬广（#12）。** #6 用微缩医生 + “错误用法”纠错，把科普感和专业感同时做出来，消耗 0.44 属中上；#12 用 CG 小水獭柜员开场，增长量 274.8 排第三，最大流失值 93.1 为全批最低。这两条证明“不像广告的开场”在这批素材里是被验证过的方向，且目前只有各 1 条，供给稀缺，值得加投复制。\n\n**② 淡斑线的“反向承诺 + 上脸实测”（#9）。** #9 增长量 276.8 为全批最高，点击峰值 14.0 也是全批最高，靠的是“大黑斑、黄黑皮”的精准痛点 + “如果不能淡化你也不要用它”的反向承诺 + 多位素人轮番上脸。这条路径把信任成本压到最低，是目前最值得批量复制的单条模板。\n\n**③ 高端出行剧情反转的压缩版（#3）。** #3 消耗 0.51 排第三，机场 + 机舱的场景稀缺度高，但点击峰值被推到 79s、最大流失在 52s，回报出现得太晚。机会不在于放弃剧情，而在于把它压缩成“3s 冲突 + 10s 内见效”，保留异域模特与高端场景的辨识度，砍掉中间铺垫。\n\n同时要明确三类需要优化的负增长类型：夫妻剧情（#10，铺垫过长、流失在 21s）、福利开箱（#11，流失在 4s）、静态对比图（#16，峰值 2s、流失 6s）。共同病灶是**实测段出现得太晚或根本没有**，解法统一为“把实测提到 15s 以内，福利与价格信息后置”。\n\n## ✅ 七、可执行建议\n\n1. **把“8–15s 出实测”写成硬性规范**：所有新脚本必须在这一区间安排一次可截图的变化瞬间（擦拭、抗摩擦、前后对比任选其一），实测段晚于 20s 的脚本一律打回重写。\n2. **达人开篇作为基本盘批量复制**：优先复用 30–45 岁、带珍珠首饰、自报年龄的熟龄达人模板（#4 #14 #15），这类素材增长量全部为正，试错成本最低。\n3. **单独开一条“淡斑反向承诺”素材线**：以 #9 为母版，固定“精准痛点 + 反向承诺 + 多人上脸”三件套，做 3–5 条变体测试不同痛点词（大黑斑 / 熬夜斑 / 黄黑皮）。\n4. **给猎奇去硬广方向加预算**：CG 萌宠（#12）与微缩医生（#6）各再扩 2–3 条，重点观察前 5s 流失是否稳定在低位，这是目前最被低估的差异化资产。\n5. **剧情类统一做“压缩版”改造**：把 #3 的机场冲突压到 3s 内、把 #10 的夫妻对话砍到 8s 内，确保 15s 前进入实测，避免重蹈 21s 与 52s 才出回报的覆辙。\n6. **福利与价格信息一律后置到 20s 之后**：#11 在 4s 就流失 101.1 是最直接的教训，福利前置等于提前劝退。\n7. **建立“消耗—增长量”双维复盘表**：把 #1 #2 这类高消耗中增长的长链路素材单独归类为“底盘素材”，与 #9 #12 这类高增长素材分开考核，避免用同一套标准误判两类素材的价值。";

<script>/**
 * Opening-type (开篇类型 一级/二级) labels and filtering for ad-hoc reports.
 * Same field precedence as the weekly report (export_public_html.py / common_features_v2_runner.py):
 * top-level _v4_open_type, then analysis.开篇类型, then analysis.素材类型.
 *
 * Shared by the internal page (dashboard/adhoc-cluster.html) and the public static export
 * (adhoc_reports.build_public_report_html inlines this file), so both show the same tags and filters.
 */
(function (root, factory) {
  const api = factory();
  if (typeof module === "object" && module.exports) module.exports = api;
  else root.AdhocOpenType = api;
})(typeof self !== "undefined" ? self : this, function () {
  const NONE = "未标注";

  function openTypeOf(it) {
    it = it || {};
    const a = it.analysis || {};
    let l1 = "", l2 = "";
    const v4 = it._v4_open_type;
    if (typeof v4 === "string" && v4.trim()) l1 = v4.trim();
    const t = a["开篇类型"] || a["素材类型"];
    if (t && typeof t === "object") {
      if (!l1) l1 = String(t["一级"] || t["一级类目"] || "").trim();
      l2 = String(t["二级"] || t["二级类目"] || t["l2"] || "").trim();
    } else if (typeof t === "string" && !l1) {
      l1 = t.trim();
    }
    return { l1: l1 || NONE, l2: l2 || NONE };
  }

  function matches(it, f) {
    const o = openTypeOf(it);
    if (f && f.l1 && f.l1.size && !f.l1.has(o.l1)) return false;
    if (f && f.l2 && f.l2.size && !f.l2.has(o.l2)) return false;
    return true;
  }

  const _sorted = m => [...m.entries()].sort((a, b) =>
    ((a[0] === NONE) - (b[0] === NONE)) || (b[1] - a[1]) || a[0].localeCompare(b[0], "zh"));

  /** Value/count pairs; second-level values are limited to the selected first-level types. */
  function facets(items, selL1) {
    const l1 = new Map(), l2 = new Map();
    (items || []).forEach(it => {
      const o = openTypeOf(it);
      l1.set(o.l1, (l1.get(o.l1) || 0) + 1);
      if (selL1 && selL1.size && !selL1.has(o.l1)) return;
      l2.set(o.l2, (l2.get(o.l2) || 0) + 1);
    });
    return { l1: _sorted(l1), l2: _sorted(l2) };
  }

  /** Drop selected second-level values that no longer belong to the selected first-level types. */
  function prune(filter, items) {
    const allowed = new Set(facets(items, filter.l1).l2.map(x => x[0]));
    [...filter.l2].forEach(v => { if (!allowed.has(v)) filter.l2.delete(v); });
    return filter;
  }

  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));

  function tagsHTML(it) {
    const o = openTypeOf(it);
    return `<div class="ot-tags"><span class="ot-tag l1" title="一级开篇类型">${esc(o.l1)}<\/span>` +
      `<span class="ot-tag l2" title="二级风格">${esc(o.l2)}<\/span><\/div>`;
  }

  const CSS = `
  .ot-bar{position:sticky;top:var(--ot-top,0);z-index:40;background:rgba(20,24,34,.97);border:1px solid #272c38;

  .ot-row{display:flex;gap:10px;align-items:flex-start;margin:4px 0}

  .ot-chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;max-height:84px;overflow:auto}
  .ot-bar .ot-l2{max-height:56px}
  .ot-chip{cursor:pointer;background:#1f232d;border:1px solid #272c38;color:#cbd2e0;border-radius:12px;
    padding:0 10px;font-size:12px;font-family:inherit;line-height:22px}
  .ot-chip:hover{border-color:#4f8cff;color:#fff}
  .ot-chip.on{background:rgba(79,140,255,.25);border-color:#4f8cff;color:#fff}
  .ot-chip i{font-style:normal;color:#6b7385;margin-left:4px}
  .ot-chip.on i{color:#cbd2e0}
  .ot-search{background:#0c0e13;border:1px solid #272c38;color:#e6e8ee;border-radius:6px;
    padding:2px 8px;font-size:12px;width:160px;font-family:inherit;margin-bottom:4px}
  .ot-foot{display:flex;gap:10px;align-items:center;font-size:12px;color:#8a93a6;margin-top:4px}
  .ot-foot b{color:#9dbcff}
  .ot-foot .ot-sel{color:#fbbf24;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px}
  .ot-btn{cursor:pointer;background:#1f232d;color:#cbd2e0;border:1px solid #272c38;border-radius:6px;
    padding:1px 10px;font-size:12px;font-family:inherit}
  .ot-btn:hover{border-color:#4f8cff;color:#fff}
  .ot-bar.collapsed .ot-row{display:none}
  .ot-tag{display:inline-block;border-radius:4px;padding:0 6px;font-size:11px;line-height:18px;margin:0 4px 2px 0}
  .ot-tag.l1{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.4);color:#fbbf24}
  .ot-tag.l2{background:rgba(79,140,255,.12);border:1px solid rgba(79,140,255,.35);color:#9dbcff}

  .ot-card .hd{display:flex;gap:6px;align-items:baseline;margin-bottom:4px}
  .ot-card .hd b{color:#9dbcff;font-family:ui-monospace,monospace}
  .ot-card .hd span{color:#8a93a6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ot-empty{color:#8a93a6;font-size:13px;padding:18px 0}
  .ot-muted{color:#6b7385;font-size:12px}`;

  function injectCSS(doc) {
    if (doc.getElementById("ot-style")) return;
    const s = doc.createElement("style");
    s.id = "ot-style"; s.textContent = CSS;
    doc.head.appendChild(s);
  }

  const refKey = (it, i) => String((it && it._ref_idx) || (i + 1));

  /**
   * Filter bar + material overview. Filtering dims non-matching #N refs in the report body and
   * hides non-matching highlight cards / overview cards.
   */
  function createUI({ doc, getItems, bar, section, content, coverOf }) {
    const f = { l1: new Set(), l2: new Set() };
    let q = "", collapsed = false;
    const items = () => getItems() || [];
    const active = () => !!(f.l1.size || f.l2.size);
    const ok = it => !it || matches(it, f);
    const chip = (k, [v, n]) =>
      `<button type="button" class="ot-chip${f[k].has(v) ? " on" : ""}" data-k="${k}" data-v="${esc(v)}">${esc(v)}<i>${n}<\/i><\/button>`;
    const l2HTML = () => {
      const s = q.trim().toLowerCase();
      const list = facets(items(), f.l1).l2.filter(([v]) => !s || v.toLowerCase().includes(s) || f.l2.has(v));
      return list.length ? list.map(x => chip("l2", x)).join("") : `<span class="ot-muted">无匹配的二级风格<\/span>`;
    };

    function renderBar() {
      const all = items();
      if (!all.length) { bar.style.display = "none"; return; }
      prune(f, all);
      const fc = facets(all, f.l1), n = all.filter(ok).length, sel = [...f.l1, ...f.l2].join("、");
      bar.className = "ot-bar" + (collapsed ? " collapsed" : "");
      bar.innerHTML = `
        <div class="ot-row"><span class="ot-lab">🎬 开篇类型<\/span><div class="ot-chips">${fc.l1.map(x => chip("l1", x)).join("")}<\/div><\/div>
        <div class="ot-row"><span class="ot-lab">🏷️ 二级风格<\/span><div style="flex:1">
          <input class="ot-search" placeholder="搜索二级风格…" value="${esc(q)}"/>
          <div class="ot-chips ot-l2">${l2HTML()}<\/div><\/div><\/div>
        <div class="ot-foot">
          <span>筛出 <b>${n}<\/b> / ${all.length} 条<\/span>
          ${sel ? `<span class="ot-sel" title="${esc(sel)}">已选：${esc(sel)}<\/span>` : `<span>选了一级后，二级只显示该一级下出现过的风格<\/span>`}
          <span style="margin-left:auto"><\/span>
          ${active() ? `<button type="button" class="ot-btn" data-act="clear">清空筛选<\/button>` : ""}
          <button type="button" class="ot-btn" data-act="toggle">${collapsed ? "展开筛选" : "收起"}<\/button>
        <\/div>`;
      bar.style.display = "block";
    }

    function renderGrid() {
      const all = items();
      if (!section) return;
      if (!all.length) { section.style.display = "none"; return; }
      const card = (it, i) => {
        const n = refKey(it, i), cover = coverOf(it);
        const img = cover ? `<img src="${esc(cover)}" loading="lazy" alt="#${esc(n)}" onerror="this.style.display='none'"/>` : "";
        const who = [it["客户简称"], it["拓品品类名称"] || it["商品类型"]].filter(Boolean).join(" · ");
        const cv = it.video_url
          ? `<a class="cv" href="${esc(it.video_url)}" target="_blank" rel="noopener" title="打开原视频">${img}<\/a>`
          : `<span class="cv">${img}<\/span>`;
        return `<div class="ot-card" data-ref="${esc(n)}">${cv}<div class="bd">` +
          `<div class="hd"><b>#${esc(n)}<\/b><span title="${esc(who)}">${esc(who)}<\/span><\/div>${tagsHTML(it)}<\/div><\/div>`;
      };
      section.innerHTML = `<h2>🏷️ 素材开篇类型一览<\/h2>
        <div class="ot-note">一级开篇类型 / 二级风格取自每条素材的解析结果，口径同周报；用顶部筛选栏筛选，正文中不符合的 #N 会变灰。<\/div>
        <div class="ot-grid">${all.map(card).join("")}<\/div>
        <div class="ot-empty" style="display:none">当前筛选下没有素材。<\/div>`;
      section.style.display = "block";
    }

    function apply() {
      const all = items(), on = active(), byRef = new Map(), byMd5 = new Map();
      all.forEach((it, i) => {
        byRef.set(refKey(it, i), it);
        if (it.md5) byMd5.set(String(it.md5).toLowerCase(), it);
      });
      content.querySelectorAll(".ref[data-ref]").forEach(el => {
        const it = byRef.get(el.dataset.ref), hit = ok(it);
        el.classList.toggle("ot-dim", on && !hit);
        el.classList.toggle("ot-hit", on && hit && !!it);
      });
      content.querySelectorAll(".hl-section .hl-card").forEach(c => {
        c.style.display = ok(byMd5.get(String(c.dataset.md5 || "").toLowerCase())) ? "" : "none";
      });
      if (!section) return;
      let shown = 0;
      section.querySelectorAll(".ot-card").forEach(c => {
        const hit = ok(byRef.get(c.dataset.ref));
        c.style.display = hit ? "" : "none"; if (hit) shown++;
      });
      const empty = section.querySelector(".ot-empty");
      if (empty) empty.style.display = shown ? "none" : "block";
    }

    bar.addEventListener("click", e => {
      const c = e.target.closest(".ot-chip");
      if (c) {
        const set = f[c.dataset.k], v = c.dataset.v;
        set.has(v) ? set.delete(v) : set.add(v);
      } else {
        const act = (e.target.closest(".ot-btn") || {}).dataset?.act;
        if (act === "clear") { f.l1.clear(); f.l2.clear(); q = ""; }
        else if (act === "toggle") collapsed = !collapsed;
        else return;
      }
      renderBar(); apply();
    });
    bar.addEventListener("input", e => {
      if (!e.target.classList.contains("ot-search")) return;
      q = e.target.value;
      const host = bar.querySelector(".ot-l2"); if (host) host.innerHTML = l2HTML();
    });

    injectCSS(doc);
    return { render() { renderBar(); renderGrid(); apply(); }, apply, filter: f };
  }

  return { NONE, openTypeOf, matches, facets, prune, tagsHTML, createUI, injectCSS, CSS };
});
</script>

  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  const num = x => x == null ? "-" : (Math.round(x * 100) / 100);
  const pct = x => x == null ? "-" : Math.round(x * 100) + "%";
  const sec = x => x == null ? "-" : (Math.round(x * 10) / 10) + "s";

  }
  const refIdx = md5 => { const it = S.items.find(x => x.md5 === md5); return it && it._ref_idx; };

  /* ---------------- 投放时序（逐秒点击 + 到达比例） ---------------- */
  function spark(c, big) {
    if (!c) return `<div class="fw-cv none">没有投放时序数据（素材缺逐秒曲线）<\/div>`;
    const W = 200, H = big ? 70 : 34, n = c.x.length, bw = W / n;
    const mx = Math.max(2, ...c.x), y = v => H - 2 - v / mx * (H - 6);
    const a = Math.floor(c.a), b = Math.ceil(c.b);
    let g = `<rect x="${a * bw}" y="0" width="${Math.max(bw, (b - a) * bw)}" height="${H}" fill="rgba(79,140,255,.10)"/>`;
    c.x.forEach((v, t) => {
      const inb = t >= a && t < b;
      g += `<rect x="${t * bw + 0.5}" y="${y(v)}" width="${Math.max(1, bw - 1)}" height="${Math.max(0.5, H - 2 - y(v))}" fill="${inb ? "#4f8cff" : "#3a4356"}"/>`;

    const rs = c.r.map((v, t) => v == null ? null : [t * bw + bw / 2, H - 2 - v * (H - 6)]).filter(Boolean);
    if (rs.length > 1) g += `<polyline points="${rs.map(p => p.join(",")).join(" ")}" fill="none" stroke="#fbbf24" stroke-width="1"/>`;
    (c.peaks || []).forEach(p => { g += `<circle cx="${p.t * bw + bw / 2}" cy="${Math.max(3, y(c.x[p.t] || 0) - 3)}" r="2.4" fill="#f472b6"/>`; });

    const eff = {}; ((res.targets || [])[S.tgt]?.rules || []).forEach(x => eff[x.id] = x.effect);
    return `<ul class="fw-rules">${rules.map(r => {
      const ef = Object.entries(eff[r.id] || {}).map(([w, n]) => `${w} ${n}`).join(" · ");
      return `<li><span class="fw-tag ${r.kind.startsWith("avoid") ? "warn" : "ok"}">${esc(KIND[r.kind] || r.kind)}<\/span>${Array.isArray(r.value) ? skel(r.value) : `<b>${esc(valTxt(r.value))}<\/b>`}
        ${r.quote ? `<span class="q"> “${esc(r.quote)}”<\/span>` : ""}${ef ? `<span style="color:#9dbcff;font-size:11px"> — ${esc(ef)}<\/span>` : ""}<\/li>`;
    }).join("")}<\/ul>`;
  }
  function storyCard(s, on) {
    const arc = (s.arc || []).map(a => `${bk(a.block)}<span class="v">${a.top.length ? esc(a.top[0].type) : "—"}<\/span>`).join('<span class="fw-ar">→<\/span>');
    const e = (s.examples || [])[0];
    return `<div class="fw-st ${on ? "on" : ""}" data-st="${esc(s.type)}" title="${esc("得分 " + num(s.score) + "\n" + explainTxt(s.explain) + (e && e.line ? "\n\n代表剧情：" + e.line : ""))}">
      <div class="h">${esc(s.type)}<span>${s.n} 条 · 得分 ${num(s.score)}${s.pinned ? " · 结论优先" : ""}<\/span><\/div>
      <div class="fw-arc">${arc}<\/div>
      ${e ? `<div class="eg"><span class="n">${who(e.md5, e.src)}<\/span>${esc(e.title || "")}<\/div>` : ""}<\/div>`;
  }
  function sinkLine(sk) {
    if (S.static) return "";       // 公网静态版：没有片段库可跳
    sk = sk || {};
    const lib = `/dashboard/framework-lib.html?report=${encodeURIComponent(S.bid)}`;
    let t;
    if (sk.status === "running" || sk.status === "queued") t = `<span class="fw-spin"><\/span>报告素材正在沉淀进片段库：${esc(sk.stage || "排队中")}${sk.todo ? `（${sk.done || 0}/${sk.todo}）` : ""}，完成后推荐会自动刷新`;
    else if (sk.status === "done") t = `报告素材 ${sk.in_lib}/${sk.total} 条已在片段库（${sk.segs} 个片段，高光 ${sk.hl_segs} 段，有投放曲线的素材 ${sk.with_curve} 条）`;
    else if (sk.status === "failed") t = `报告素材沉淀失败：${esc(sk.error || "")} <span class="fw-btn" data-act="sink">重新沉淀<\/span>`;
    else t = `报告素材还没沉淀进片段库 <span class="fw-btn" data-act="sink">沉淀<\/span>`;
    return `<div class="fw-note" style="margin-top:4px">${t} <a class="fw-btn" href="${lib}" target="_blank">去片段库看 →<\/a><\/div>`;
  }
  function render() {
    if (!S.el) return;
    const sum = S.meta.mode === "cluster";
    S.el.innerHTML = `<div class="fw-sec"><h2>${sum ? "🧩 框架总结：这批素材的框架 → 故事 → 片段" : "🎯 素材推荐：框架 → 故事 → 片段"}<\/h2>${body()}<\/div>`;
  }
  function body() {
    const r = S.rec;
    if (!r) return `<div class="fw-note"><span class="fw-spin"><\/span>加载中…<\/div>`;
    const res = r.result || {};
    if (res.status === "off") return `<div class="fw-note">创建这份对比分析时选了“不推荐”。<\/div>`;
    if (res.status === "running" && !(res.targets || []).length) return `<div class="fw-box"><span class="fw-spin"><\/span>${S.meta.mode === "cluster" ? "正在统计这批素材的框架…" : "正在按报告结论生成推荐（约半分钟）…"}<\/div>`;
    if (res.status === "failed" && !(res.targets || []).length) return `<div class="fw-box">推荐生成失败：${esc(res.error || "")}<\/div>`;
    const tg = res.targets || [];
    if (!tg.length) return `<div class="fw-note">还没有推荐结果。<\/div>`;
    S.tgt = Math.min(S.tgt, tg.length - 1);
    const t = tg[S.tgt];
    const sum = res.kind === "summary" || S.meta.mode === "cluster";
    const busy = res.status === "running" ? `<div style="color:#fbbf24;margin-bottom:4px"><span class="fw-spin"><\/span>${sum ? "报告素材刚沉淀进片段库，正在刷新…" : "正在刷新推荐（报告结论改过了，或报告素材刚沉淀进片段库）…"}<\/div>` : "";
    let h;
    if (sum) {
      h = `<div class="fw-note" style="margin-bottom:12px">统计这批素材自己用了哪些结构框架、每个框架下讲什么故事、每块是怎么拍的（片段只取自这批素材）。<\/div>
        <div class="fw-box">${busy}<div class="fw-note">这批 ${t.n} 条素材，主要类目「${esc(t.category || "-")}」，${esc(res.at || "")} 统计<\/div>${sinkLine(r.sink)}<\/div>`;
    } else {
      const bp = Object.entries(res.batch_perf || {}).map(([k, v]) => `${k} 批 ${v}`).join("，");
      h = `<div class="fw-note" style="margin-bottom:12px">选出表现不行的那一批，按报告结论给它推荐：先选结构框架，再选这个框架下讲的故事，最后看每块可参考的内容片段（来自报告素材 + 同类目大盘）。<\/div>
        <div class="fw-box">${busy}
        <div style="font-size:14px;color:#e6edf3;margin-bottom:4px">推荐给 <b>${esc(t.label)}<\/b>（${t.n} 条）<\/div>
        <div class="fw-note">${t.note ? esc(t.note) + "。" : ""}${bp && !String(t.note || "").includes("表现分") ? "各批表现分：" + esc(bp) + "。" : ""}类目「${esc(t.category || "全库")}」，推荐池 ${t.pool.n} 条（${esc(srcTxt(t.pool.src))}）<\/div>
        ${(t.current || []).length ? `<div class="fw-note">${esc(t.label)}现在主要用：${t.current.map(c => `${skel(c.skeleton)}（${c.n} 条）`).join("　")}<\/div>` : ""}
        ${sinkLine(r.sink)}<\/div>
        <div class="fw-box"><div style="font-weight:600;color:#e6edf3;font-size:13px;margin-bottom:6px">报告结论 → 推荐约束（不要的排除，优先的置顶，其余按数据排）<\/div>${rulesBlock(res)}<\/div>`;
    }
    const fws = t.frameworks || [];
    if (!fws.length) return h + `<div class="fw-box">${sum ? "这批素材统计不出结构框架（需要素材有“素材结构”解析）。" : "满足结论约束的框架统计不出来（推荐池样本不足）。"}<\/div>`;
    S.fw = Math.min(S.fw, fws.length - 1);
    const fw = fws[S.fw], maxSc = Math.max(...fws.map(f => f.score), 0.001);
    const stories = fw.stories || [];
    const skey = S.tgt + "|" + S.fw;
    const story = stories.find(s => s.type === S.story[skey]) || stories[0];
    const blocks = (fw.by_story && (story ? fw.by_story[story.type] : Object.values(fw.by_story)[0])) || fw.blocks || [];
    h += `<div class="fw-lvl"><b>① ${sum ? "这批素材用的框架" : "推荐框架"}<\/b>${sum ? "按得分排序；" : ""}得分 = 表现×0.6 + 使用面×0.25 + 高光率×0.15，表现和高光率按样本量向${sum ? "这批" : "池"}均值收缩${sum ? "" : "；结论指定的置顶"}（悬停看明细）<\/div>
      <div class="fw-fws">${fws.map((f, k) => `<div class="fw-fw ${k === S.fw ? "on" : ""}" data-fw="${k}" title="${esc("得分 " + num(f.score) + "\n" + explainTxt(f.explain))}">
        <div>${skel(f.skeleton)}<\/div>
        <div class="st"><span><b>${f.n}<\/b> 条${f.share != null ? " · 占 " + pct(f.share) : ""}<\/span><span>得分 <b>${num(f.score)}<\/b><\/span><span>表现 <b>${num(f.perf)}<\/b><\/span><span>高光率 <b>${pct(f.hl_rate_raw)}<\/b><\/span><span>ctr <b>${num(f.ctr)}<\/b><\/span><span>cvr <b>${num(f.cvr)}<\/b><\/span><\/div>
        <div style="margin-top:4px">${f.pinned ? `<span class="fw-tag mid" title="${esc(f.pinned.quote || "")}">结论指定<\/span>` : ""}${sum ? (f.examples || []).map(e => `<span class="fw-tag" title="${esc((e.title || "") + "\n" + (e.line || ""))}">${who(e.md5, e.src)}<\/span>`).join("") : `<span class="fw-tag">${esc(t.label)}里 ${f.target_n || 0} 条在用<\/span><span class="fw-tag dim">${esc(srcTxt(f.src))}<\/span>`}<\/div>
        <div class="fw-bar"><i style="width:${Math.round(Math.max(0, f.score) / maxSc * 100)}%"><\/i><\/div><\/div>`).join("")}<\/div>
      <div class="fw-lvl"><b>② 这个框架下讲什么故事<\/b>每块最常讲的内容连起来就是这类故事的走法（悬停看代表剧情）；点选一个，下方按它${sum ? "列出每块的片段" : "推荐每块的片段"}<\/div>
      <div class="fw-sts">${stories.map(s => storyCard(s, s.type === story?.type)).join("") || `<div class="fw-note">${fw.n ? "这个框架下的故事都被报告结论排除了" : "推荐池里没有素材用这个框架（报告结论指定的），故事不限，下方片段按块从整个推荐池挑"}<\/div>`}<\/div>
      <div class="fw-lvl"><b>③ ${sum ? "每块的内容片段" : "每块推荐的内容片段"}<\/b>按故事「${esc(story?.type || "不限")}」：先从讲这个故事的素材里挑，不够用其他故事的片段补位；片段下方是它在原素材里的投放时序（悬停看图例），点封面播放<\/div>
      <div class="fw-cols">${blocks.map(b => {
        const key = skey + "|" + (story?.type || "") + "|" + b.block, open = S.open[key], more = b.more || [];
        const nm = (b.beats || []).filter(x => x.story_match !== false).length;
        return `<div class="fw-col"><div class="ch"><div class="r">${bk(b.block)}<span>${esc(b.desc)}<\/span>${story && (b.beats || []).length ? `<span style="margin-left:auto">${nm}/${b.beats.length} 出自本故事<\/span>` : ""}<\/div>
<\/div><div class="bs">
          ${(b.beats || []).map(beatCard).join("") || '<div class="fw-note">没有满足约束的片段<\/div>'}
          ${more.length ? (open ? more.map(beatCard).join("") : `<div class="fw-more" data-more="${esc(key)}">再看 ${more.length} 个候选 ▾<\/div>`) : ""}<\/div><\/div>`;
      }).join("")}<\/div>`;
    return h;
  }

  /* ---------------- 加载 / 事件 ---------------- */
  function poll(name, fn, ms) { clearTimeout(S.timers[name]); S.timers[name] = setTimeout(fn, ms); }
  async function loadRec() {
    try { S.rec = await api("fw-rec"); } catch (e) { S.rec = {result: {status: "failed", error: e.message}}; }
    render();
    const sk = S.rec?.sink?.status;
    if (S.rec?.result?.status === "running") poll("rec", loadRec, 5000);
    else if (sk === "running" || sk === "queued") poll("rec", loadRec, 10000);
  }
  function onClick(e) {
    const g = sel => e.target.closest(sel);
    let x;
    if ((x = g("[data-act]")) && x.dataset.act === "sink") {
      api("fw-sink", {}).then(() => loadRec()).catch(err => toast(err.message)); return;
    }
    if ((x = g("[data-tgt]"))) { S.tgt = +x.dataset.tgt; S.fw = 0; render(); return; }
    if ((x = g("[data-fw]"))) { S.fw = +x.dataset.fw; render(); return; }
    if ((x = g("[data-st]"))) { S.story[S.tgt + "|" + S.fw] = x.dataset.st; render(); return; }
    if ((x = g("[data-more]"))) { S.open[x.dataset.more] = true; render(); return; }
    if ((x = g("[data-play]"))) play(JSON.parse(x.dataset.play));
  }
  function play(x) {
    let m = document.getElementById("fwMask");
    if (!m) { m = document.createElement("div"); m.id = "fwMask"; m.className = "fw-mask"; document.body.appendChild(m);
      m.addEventListener("click", ev => { if (ev.target === m) close(); }); }
    const close = () => { const v = m.querySelector("video"); if (v) v.pause(); m.classList.remove("show"); };
    m.innerHTML = `<div class="fw-player"><video src="${esc(/^https?:/.test(x.mp4 || "") ? x.mp4 : encodeURI(x.mp4 || ""))}#t=${x.s},${x.e}" controls autoplay playsinline preload="auto"><\/video>
      <div class="pi"><div style="display:flex"><b style="font-size:15px;flex:1">${esc(x.label)}<\/b><span class="fw-x" id="fwPx" style="font-size:18px">×<\/span><\/div>
        <div><span class="fw-tag">${esc(x.type)}<\/span>${x.scene ? `<span class="fw-tag">${esc(x.scene)}<\/span>` : ""}${x.story ? `<span class="fw-tag mid">出自：${esc(x.story)}<\/span>` : ""}${x.hl ? '<span class="fw-tag ok">高光<\/span>' : ""}<span class="fw-tag dim">${who(x.md5, x.src)}<\/span><\/div>
        <div class="fw-note">${x.orig ? "原视频第" : "推荐片段"} ${sec(x.s)} – ${sec(x.e)}（自动从这里开始播，到点暂停${x.orig ? "；拖动进度条可看完整原片" : ""}）${x.spend ? " · 原素材消耗 " + num(x.spend) + " 万" : ""}<\/div>
        <div style="line-height:1.7">${esc(x.text || "（无台词）")}<\/div>
        ${x.visual ? `<div class="fw-note">画面：${esc(x.visual)}<\/div>` : ""}
        <div><div class="fw-note" style="margin-bottom:2px">投放时序<\/div>${spark(x.curve, true)}<\/div>
        <div class="fw-ex"><b style="color:#e6edf3">推荐得分 ${num(x.score)}<\/b>\n${esc(explainTxt(x.explain))}${(x.hl_why || []).length ? "\n\n高光依据：\n" + esc(x.hl_why.join("\n")) : ""}<\/div><\/div><\/div>`;
    const v = m.querySelector("video");
    let stopAt = x.e;      // 只在第一次播到片段终点时暂停；之后用户拖动 / 继续播放不再拦
    v.addEventListener("timeupdate", () => { if (stopAt && v.currentTime >= stopAt) { v.pause(); stopAt = 0; } });
    v.addEventListener("loadedmetadata", () => { if (Math.abs(v.currentTime - x.s) > 0.5) v.currentTime = x.s; }, {once: true});
    m.querySelector("#fwPx").onclick = close;
    m.classList.add("show");
  }

  window.AdhocFW = {
    init(o) {
      if (!o || !o.el || !["compare_many", "cluster"].includes((o.meta || {}).mode)) return;
      if (!document.getElementById("fwCss")) { const s = document.createElement("style"); s.id = "fwCss"; s.textContent = CSS; document.head.appendChild(s); }
      Object.assign(S, {bid: o.bid, items: o.items || [], meta: o.meta || {}, el: o.el, static: !!o.data});
      if (!S.el._fwBound) { S.el.addEventListener("click", onClick); S.el._fwBound = true; }
      if (o.data) {                 // 公网静态版：推荐结果已内联，不请求后端
        const res = (o.data || {}).result || {};
        if (!(res.targets || []).length) return;
        const th = o.data.thumbs || {};
        const walk = v => { if (Array.isArray(v)) v.forEach(walk); else if (v && typeof v === "object") {
          if (typeof v.jpg === "string" && v.jpg.startsWith("thumb:")) v.jpg = th[v.jpg.slice(6)] || "";
          Object.values(v).forEach(walk); } };
        walk(res);
        S.rec = o.data; render(); return;
      }
      render();
      loadRec();
    },
    refresh() { loadRec(); },
  };
})();
</script>
<script>/* 报告页左侧目录：正文二级标题 + 高光时序 + 框架总结 / 素材推荐 + 对话调整；滚动时高亮当前模块。
 * 内网 adhoc-cluster.html 和公网静态版（adhoc_reports.build_public_report_html 内联本文件）共用。
 * 用法：AdhocTOC.init({top: 72})   top = 目录距窗口顶部的像素（内网有吸顶工具栏，公网没有）。
 */
(function () {
  const CSS = `
  #content h2,#fwSection h2,#chatWrap{scroll-margin-top:var(--toc-top,70px)}
  .toc{position:fixed;left:16px;width:200px;overflow:auto;z-index:40;
    background:rgba(20,24,34,.92);border:1px solid #272c38;border-radius:10px;padding:10px 8px;font-size:12px}
  .toc .tt{color:#8a93a6;font-size:11px;padding:0 8px 6px;display:flex;justify-content:space-between;cursor:pointer;user-select:none}
  .toc a{display:block;color:#a8b1c4;text-decoration:none;padding:4px 8px;border-radius:5px;line-height:1.45;
    border-left:2px solid transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .toc a:hover{color:#fff;background:rgba(79,140,255,.08)}
  .toc a.on{color:#fff;border-left-color:#4f8cff;background:rgba(79,140,255,.12)}
  .toc a.ext{color:#fbbf24} .toc a.ext.on{border-left-color:#f59e0b}
  .toc.fold .lst{display:none}
  @media (max-width:1380px){ .toc{width:150px;left:8px} }
  @media (max-width:1240px){ .toc:not(.open) .lst{display:none} .toc{width:auto} }`;

  function init(opt) {
    opt = opt || {};
    const top = opt.top == null ? 72 : opt.top;
    if (document.getElementById("toc")) return;
    const st = document.createElement("style");
    st.textContent = CSS;
    document.head.appendChild(st);
    document.documentElement.style.setProperty("--toc-top", (top - 2) + "px");
    const toc = document.createElement("nav");
    toc.className = "toc"; toc.id = "toc"; toc.style.display = "none";
    toc.style.top = top + "px"; toc.style.maxHeight = `calc(100vh - ${top + 28}px)`;
    toc.innerHTML = '<div class="tt"><span>目录<\/span><span>▾<\/span><\/div><div class="lst"><\/div>';
    document.body.appendChild(toc);
    const lst = toc.querySelector(".lst");
    let heads = [], timer = 0;
    toc.querySelector(".tt").onclick = () => toc.classList.toggle(window.innerWidth <= 1240 ? "open" : "fold");
    const txt = el => (el.textContent || "").replace(/\s+/g, " ").trim();
    const esc = s => s.replace(/&/g, "&amp;").replace(/[<]/g, "&lt;").replace(/"/g, "&quot;");

    function build() {
      const hs = [];
      document.querySelectorAll("#content h2").forEach(h => hs.push({el: h, ext: !!h.closest(".hl-section")}));
      document.querySelectorAll("#fwSection h2").forEach(h => hs.push({el: h, ext: true}));
      const chat = document.getElementById("chatWrap");
      if (chat && chat.offsetParent) hs.push({el: chat, ext: true, label: "💬 对话式调整报告"});
      heads = hs.filter(h => h.el.offsetParent);
      if (heads.length < 2) { toc.style.display = "none"; return; }
      toc.style.display = "";
      lst.innerHTML = heads.map((h, i) => {
        const t = h.label || txt(h.el);
        return `<a href="#" data-i="${i}" class="${h.ext ? "ext" : ""}" title="${esc(t)}">${esc(t)}<\/a>`;
      }).join("");
      lst.querySelectorAll("a").forEach(a => a.onclick = e => {
        e.preventDefault();
        heads[+a.dataset.i].el.scrollIntoView({behavior: "smooth", block: "start"});
        if (window.innerWidth <= 1240) toc.classList.remove("open");
      });
      spy();
    }
    function spy() {
      let cur = 0;
      heads.forEach((h, i) => { if (h.el.getBoundingClientRect().top < top + 50) cur = i; });
      lst.querySelectorAll("a").forEach((a, i) => a.classList.toggle("on", i === cur));
      const on = lst.querySelector("a.on");
      if (on && (on.offsetTop < toc.scrollTop || on.offsetTop > toc.scrollTop + toc.clientHeight - 30))
        toc.scrollTop = on.offsetTop - 60;
    }
    const later = () => { clearTimeout(timer); timer = setTimeout(build, 300); };
    ["content", "fwSection"].forEach(id => {
      const el = document.getElementById(id);
      if (el) new MutationObserver(later).observe(el, {childList: true, subtree: true});
    });
    window.addEventListener("scroll", () => requestAnimationFrame(spy), {passive: true});
    window.addEventListener("resize", later);
    later();
  }
  window.AdhocTOC = {init};
})();
</script>
<script>
function escapeAttr(s){return String(s==null?"":s).replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function _buildRef(n, items){
  const idxToItem = new Map();
  items.forEach((it, i) => idxToItem.set((it && it._ref_idx) || (i + 1), it));
  const it = idxToItem.get(n);
  if(!it) return '<span class="ref-miss">#'+n+'</span>';
  const md5 = it.md5 || "";
  const isValidMd5 = md5 && /^[0-9a-fA-F]{32}$/.test(md5);
  const cover = it._cover_url || "";
  const vurl = (it.video_url || "").replace(/"/g, "%22").replace(/'/g, "%27");
  const ot = window.AdhocOpenType ? AdhocOpenType.openTypeOf(it) : null;
  const title = ('#'+n+' '+(it["客户简称"]||"")+' '+(it["拓品品类名称"]||it["商品类型"]||"")).trim()
    + (ot ? ' · 开篇：'+ot.l1+' / '+ot.l2 : '');
  const thumb = cover ? '<img class="ref-thumb" src="'+escapeAttr(cover)+'" loading="lazy" alt="#'+n+'" onerror="this.style.display=\'none\'"/>' : "";
  if(vurl){ return '<a class="ref" data-ref="'+n+'" href="'+escapeAttr(vurl)+'" target="_blank" rel="noopener" title="'+escapeAttr(title)+'"><span class="ref-num">#'+n+'</span>'+thumb+'</a>'; }
  return '<span class="ref" data-ref="'+n+'" title="'+escapeAttr(title)+'"><span class="ref-num">#'+n+'</span>'+thumb+'</span>';
}
function replaceHashRefs(input, items){
  if(!input || !items || !items.length) return input || "";
  const replaceInText = (text) => text.replace(/#(\d+)\b/g, (_, nStr) => _buildRef(parseInt(nStr, 10), items));
  return String(input).split(/(<[^>]+>)/g).map((seg) => seg.startsWith("<") ? seg : replaceInText(seg)).join("");
}

// ============================================================================
// 高光时序区（公开版）：曲线 + 悬停 tooltip + 完整脚本双向联动 + 转化点
//   移植自内网 dashboard/adhoc-cluster.html，保持同一套视觉与交互；
//   数据来自 ITEMS[].highlight（由 _slim_highlight 精简后内联进本文件，自包含）。
// ============================================================================
function escapeHTML(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
const _HL_METRICS = [["点击","#4f8cff"],["点赞","#22c55e"],["转发","#f59e0b"],["流失","#ef4444"]];
const _HL_BURST = {"点击":"点击爆点","点赞":"点赞爆点","转发":"转发爆点","流失":"最大流失点"};
const _HLG = {W:560,H:180,PL:40,PR:14,PT:14,PB:26};

function _hlFmtSec(ms){ ms=+ms||0; return ms>=1000 ? (ms%1000?(ms/1000).toFixed(1):(ms/1000|0))+"s" : (ms|0)+"ms"; }

// 把「完整脚本」按 "0-3s：xxx" / "3~8秒 xxx" 切成带起止秒的句子单元
function _hlParseScript(analysis){
  const full = String((analysis&&(analysis.完整脚本||analysis.脚本拆解))||"");
  const units = [];
  const re = /(?:^|\n)\s*[-*#>\d.、]*\s*(\d+(?:\.\d+)?)\s*(?:s|秒)?\s*(?:-|~|～|至|到)\s*(\d+(?:\.\d+)?)\s*(?:s|秒)?\s*[：:]?\s*([^\n]+)/gi;
  let m;
  while((m = re.exec(full))){
    units.push({start:+m[1], end:+m[2], text:m[3].replace(/\s+/g," ").replace(/^[-*：:\s]+/,"").trim()});
  }
  return units;
}

function _hlChartSVG(node){
  const s = (node.series||[]).slice().sort((a,b)=>(a.play_index||0)-(b.play_index||0));
  if(s.length < 2) return "";
  const {W,H,PL,PR,PT,PB} = _HLG, iw=W-PL-PR, ih=H-PT-PB;
  const xs = s.map(p=>p.play_index||0), xmin=Math.min(...xs), xmax=Math.max(...xs);
  let ymax=1; s.forEach(p=>_HL_METRICS.forEach(([n])=>{ if((+p[n]||0)>ymax) ymax=+p[n]; }));
  const sx = x => PL + (xmax===xmin?0:(x-xmin)/(xmax-xmin))*iw;
  const sy = y => PT + ih - (y/ymax)*ih;
  let lines="", dots="";
  _HL_METRICS.forEach(([n,c])=>{
    lines += '<polyline fill="none" stroke="'+c+'" stroke-width="1.8" opacity=".9" points="'+
      s.map(p=>sx(p.play_index||0).toFixed(1)+","+sy(+p[n]||0).toFixed(1)).join(" ")+'"/>';
    const bb=(node.爆点||{})[_HL_BURST[n]]||{};
    if(bb.play_index && bb.value) dots += '<circle cx="'+sx(bb.play_index).toFixed(1)+'" cy="'+sy(bb.value).toFixed(1)+
      '" r="3.5" fill="'+c+'" stroke="#0f1115" stroke-width="1"/>';
  });
  let ticks="";
  [xmin,(xmin+xmax)/2,xmax].forEach(t=>{ ticks += '<text x="'+sx(t).toFixed(1)+'" y="'+(H-8)+
    '" fill="#8a93a6" font-size="10" text-anchor="middle">'+_hlFmtSec(t)+'</text>'; });
  return '<svg class="hl-svg" viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet"'+
    ' data-xmin="'+xmin+'" data-xmax="'+xmax+'" data-ymax="'+ymax+'">'+
    '<line x1="'+PL+'" y1="'+(PT+ih)+'" x2="'+(W-PR)+'" y2="'+(PT+ih)+'" stroke="#2a3550" stroke-width="1"/>'+
    '<line x1="'+PL+'" y1="'+PT+'" x2="'+PL+'" y2="'+(PT+ih)+'" stroke="#2a3550" stroke-width="1"/>'+
    lines+dots+ticks+
    '<line class="hl-cursor" x1="0" y1="'+PT+'" x2="0" y2="'+(PT+ih)+'" stroke="#9dbcff" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>'+
    '<rect class="hl-hit" x="'+PL+'" y="'+PT+'" width="'+iw+'" height="'+ih+'" fill="transparent" style="cursor:crosshair"/>'+
    '</svg>';
}

function _hlCardHTML(it){
  const n = it._ref_idx || "";
  const hl = it.highlight||{};
  const who = it["客户简称"]||it["拓品品类名称"]||it["商品类型"]||"";
  const batch = it._batch ? '<span class="hl-batch">'+escapeHTML(it._batch)+'批</span>' : "";
  const legend = _HL_METRICS.map(([n2,c])=>'<span class="hl-lg"><i style="background:'+c+'"></i>'+n2+'</span>').join("");
  const units = _hlParseScript(it.analysis||{});
  const scriptHtml = units.length
    ? units.map(u=>'<span class="hl-su" data-s="'+u.start+'" data-e="'+u.end+'">'+
        escapeHTML(u.start)+"-"+escapeHTML(u.end)+"s "+escapeHTML(u.text)+'</span>').join("")
    : '<span class="hl-muted">（无可解析的分段脚本）</span>';
  const conv = (hl.转化分析||{});
  const reason = conv.转化原因 ? '<div class="hl-reason">🎯 '+escapeHTML(conv.转化原因)+'</div>' : "";
  const bursts = Array.isArray(conv.爆点)&&conv.爆点.length
    ? '<ul class="hl-bursts">'+conv.爆点.map(b=>"<li>"+escapeHTML(b)+"</li>").join("")+'</ul>' : "";
  return '<div class="hl-card" data-md5="'+escapeAttr(it.md5||"")+'">'+
    '<div class="hl-head">'+batch+'<b>#'+escapeHTML(n)+'</b> <span class="hl-who">'+escapeHTML(who)+'</span>'+
      '<span class="hl-cal">近7天日均'+(hl.口径&&hl.口径.video_duration?" · 时长"+escapeHTML(hl.口径.video_duration)+"s":"")+'</span>'+
      '<span class="hl-legend">'+legend+'</span></div>'+
    (window.AdhocOpenType ? AdhocOpenType.tagsHTML(it) : "")+
    '<div class="hl-chart">'+_hlChartSVG(hl)+'<div class="hl-tip" style="display:none"></div></div>'+
    reason+bursts+
    '<details class="hl-script" open><summary>📜 完整脚本（与曲线双向联动）</summary><div class="hl-flow">'+scriptHtml+'</div></details>'+
    '</div>';
}

function _wireHlCard(card, items){
  const svg = card.querySelector(".hl-svg"), tip = card.querySelector(".hl-tip");
  const hit = card.querySelector(".hl-hit"), cursor = card.querySelector(".hl-cursor");
  const units = Array.prototype.slice.call(card.querySelectorAll(".hl-su"));
  if(!svg || !hit) return;
  const md5 = card.getAttribute("data-md5");
  const item = (items||[]).find(it=>it.md5===md5) || {};
  const s = (((item.highlight||{}).series)||[]).slice().sort((a,b)=>(a.play_index||0)-(b.play_index||0));
  if(!s.length) return;
  const xmin=+svg.dataset.xmin, xmax=+svg.dataset.xmax;
  const W=_HLG.W, PL=_HLG.PL, iw=W-PL-_HLG.PR;
  function setActive(sec){
    units.forEach(u=>{ const a=+u.dataset.s, b=+u.dataset.e; u.classList.toggle("on", !isNaN(sec)&&sec>=a-0.05&&sec<=b+0.05); });
  }
  function tipHTML(sec, best){
    return '<div class="hl-tip-sec">'+sec.toFixed(1)+'s</div>'+
      _HL_METRICS.map(([n,c])=>'<div class="hl-tip-row"><i style="background:'+c+'"></i>'+n+' <b>'+(+best[n]||0)+'</b></div>').join("");
  }
  hit.addEventListener("mousemove", ev=>{
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left)/r.width*W;
    const frac = Math.max(0, Math.min(1, (px-PL)/iw));
    const pi = xmin + frac*(xmax-xmin);
    let best=s[0], bd=Infinity; s.forEach(p=>{ const d=Math.abs((p.play_index||0)-pi); if(d<bd){bd=d;best=p;} });
    const sec = (best.play_index||0)/1000;
    cursor.style.display="block";
    const cx = PL + (xmax===xmin?0:((best.play_index||0)-xmin)/(xmax-xmin))*iw;
    cursor.setAttribute("x1",cx.toFixed(1)); cursor.setAttribute("x2",cx.toFixed(1));
    tip.style.display="block";
    tip.style.left = Math.min(r.width-150, Math.max(0, (cx/W)*r.width - 40))+"px";
    tip.innerHTML = tipHTML(sec, best);
    setActive(sec);
  });
  hit.addEventListener("mouseleave", ()=>{ tip.style.display="none"; cursor.style.display="none"; setActive(NaN); });
  // 反向联动：悬停脚本句 → 曲线定位
  function cursorAtSec(sec){
    const pi = sec*1000;
    const cx = PL + (xmax===xmin?0:(pi-xmin)/(xmax-xmin))*iw;
    cursor.style.display="block";
    cursor.setAttribute("x1",cx.toFixed(1)); cursor.setAttribute("x2",cx.toFixed(1));
    let best=s[0], bd=Infinity; s.forEach(p=>{ const d=Math.abs((p.play_index||0)-pi); if(d<bd){bd=d;best=p;} });
    const r = svg.getBoundingClientRect();
    tip.style.display="block";
    tip.style.left = Math.min(r.width-150, Math.max(0, (cx/W)*r.width - 40))+"px";
    tip.innerHTML = tipHTML(sec, best);
  }
  units.forEach(u=>{
    u.addEventListener("mouseenter", ()=>{ u.classList.add("on"); cursorAtSec((+u.dataset.s + +u.dataset.e)/2); });
    u.addEventListener("mouseleave", ()=>{ u.classList.remove("on"); tip.style.display="none"; cursor.style.display="none"; });
  });
}

// ---------------------------------------------------------------------------
// 悬停浮层：鼠标移到 #N chip 上弹出该素材的高光卡（与内网一致）
// ---------------------------------------------------------------------------
let _hlPopEl = null, _hlPopHideTimer = null, _hlPopShowTimer = null;
function _hlEnsurePopover(){
  if(_hlPopEl) return _hlPopEl;
  _hlPopEl = document.createElement("div");
  _hlPopEl.className = "hl-pop";
  _hlPopEl.style.display = "none";
  _hlPopEl.addEventListener("mouseenter", ()=>{ clearTimeout(_hlPopHideTimer); });
  _hlPopEl.addEventListener("mouseleave", ()=>{ _hlHidePopover(); });
  _hlPopEl.addEventListener("click", e=>{ if(e.target.closest(".hl-pop-close")) _hlHidePopover(0); });
  document.body.appendChild(_hlPopEl);
  document.addEventListener("keydown", e=>{ if(e.key==="Escape") _hlHidePopover(0); });
  window.addEventListener("scroll", ()=>{
    if(_hlPopEl.style.display!=="none" && !_hlPopEl.matches(":hover")) _hlHidePopover(0);
  }, {passive:true});
  return _hlPopEl;
}
function _hlHidePopover(delay){
  delay = (delay===undefined) ? 180 : delay;
  clearTimeout(_hlPopShowTimer); clearTimeout(_hlPopHideTimer);
  _hlPopHideTimer = setTimeout(()=>{ if(_hlPopEl) _hlPopEl.style.display="none"; }, delay);
}
function _hlQueuePopover(anchorEl, it){
  clearTimeout(_hlPopShowTimer); clearTimeout(_hlPopHideTimer);
  _hlPopShowTimer = setTimeout(()=>_hlShowPopover(anchorEl, it), 350);
}
function _hlShowPopover(anchorEl, it){
  const pop = _hlEnsurePopover();
  clearTimeout(_hlPopHideTimer);
  pop.innerHTML = '<button type="button" class="hl-pop-close" aria-label="关闭">×</button>' + _hlCardHTML(it);
  const script = pop.querySelector("details.hl-script"); if(script) script.open = false;
  pop.style.display = "block";
  const r = anchorEl.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight, gap = 12;
  const col = (document.getElementById("content")||document.body).getBoundingClientRect();
  const margin = Math.max(vw - col.right, col.left), side = margin - gap*2 >= 340;
  const pw = side ? Math.min(460, margin - gap*2) : Math.min(460, vw - 24);
  pop.style.width = pw + "px";
  pop.style.maxHeight = "";
  pop.style.top = "-9999px";
  let ph = pop.offsetHeight, x, y;
  if(side){
    x = vw - col.right >= col.left ? col.right + gap : col.left - pw - gap;
    y = Math.min(Math.max(8, r.top + r.height/2 - ph/2), vh - ph - 8);
  }else{
    const below = vh - r.bottom - gap - 8, above = r.top - gap - 8;
    const room = below >= ph || below >= above ? below : above;
    if(ph > room){ pop.style.maxHeight = Math.max(160, room) + "px"; ph = pop.offsetHeight; }
    x = Math.min(vw - pw - 12, Math.max(12, r.left));
    y = room === below ? r.bottom + gap : r.top - gap - ph;
  }
  pop.style.left = x + "px";
  pop.style.top = y + "px";
  const card = pop.querySelector(".hl-card");
  if(card) _wireHlCard(card, (typeof ITEMS!=="undefined" ? ITEMS : []) );
}

// ---------------------------------------------------------------------------
// 转化点分析（纯前端、只读已有数据，与内网同一套口径）
// ---------------------------------------------------------------------------
function _cvPeak(hl){
  const b = ((hl.爆点||{}).点击爆点)||{};
  if(+b.value > 0) return {ms:+b.play_index||0, value:+b.value};
  let best = null;
  (hl.series||[]).forEach(p=>{ if(+p.点击 > 0 && (!best || +p.点击 > best.value)) best = {ms:+p.play_index||0, value:+p.点击}; });
  return best;
}
function _cvSplitLine(text){
  const t = String(text||""), who = [], line = [];
  const re = /([^『「“』」”]*?)\s*[：:]?\s*[『「“]([^』」”]*)[』」”]?/g;
  let m;
  while((m = re.exec(t)) && m[0]){
    const w = m[1].replace(/^[\s，,；;。]+|[\s：:]+$/g,"").trim();
    if(w && who.indexOf(w) < 0) who.push(w);
    if(m[2].trim()) line.push(m[2].trim());
  }
  return line.length ? {who:who.join(" / "), line:line.join(" / ")} : {who:"", line:t.trim()};
}
function _cvReasonFor(hl, peak){
  const text = String(((hl.转化分析||{}).转化原因)||"");
  if(!text) return "";
  const parts = text.split(/(?<=[。；;！!])/).map(s=>s.trim()).filter(Boolean);
  const sec = peak.ms/1000, clicks = parts.filter(s=>/点击|转化/.test(s));
  const hasVal = s => (s.match(/\d+(?:\.\d+)?/g)||[]).some(n=>n.indexOf(".")>=0 && Math.abs(+n - peak.value) < 0.05);
  const near = s => (s.match(/\d+(?:\.\d+)?(?=\s*(?:s|秒|-|–|~|～))/g)||[]).some(n=>Math.abs(+n - sec) <= 3);
  return clicks.find(hasVal) || clicks.find(s=>near(s) && !/骤降|下降|流失/.test(s)) || "";
}
function _cvRows(withHl){
  return withHl.map(it=>{
    const hl = it.highlight||{}, peak = _cvPeak(hl);
    if(!peak) return {it:it, peak:null};
    const sec = peak.ms/1000, units = _hlParseScript(it.analysis||{});
    let i = units.findIndex(u=>sec >= u.start && sec <= u.end + 0.999);
    if(i < 0 && units.length) i = units.reduce((k,u,j)=>Math.abs(u.start-sec) < Math.abs(units[k].start-sec) ? j : k, 0);
    const cur = i >= 0 ? units[i] : null, prev = i > 0 ? units[i-1] : null;
    return {it:it, peak:peak, sec:sec, cur:cur, prev:prev, split:cur ? _cvSplitLine(cur.text) : null,
            reason:_cvReasonFor(hl, peak), early:peak.ms <= 1000};
  });
}
let _cvPayload = [];
function _hlConversionHTML(withHl){
  const rows = _cvRows(withHl), ok = rows.filter(r=>r.peak), noPeak = rows.filter(r=>!r.peak);
  if(!ok.length) return "";
  const ref = r => '#'+escapeHTML(r.it._ref_idx||"");
  const grouped = ok.some(r=>r.it._batch);
  _cvPayload = ok.filter(r=>r.cur).map(r=>({
    ref:'#'+(r.it._ref_idx||""), group:r.it._batch||"", sec:+r.sec.toFixed(1), value:r.peak.value, early:r.early,
    line:(r.split||{}).line||"", prev:r.prev?_cvSplitLine(r.prev.text).line:"", who:(r.split||{}).who||"",
    reason:r.reason||"", customer:r.it["客户简称"]||""}));
  const tr = r => {
    const s = r.split || {who:"", line:""};
    const prev = r.prev ? '<div class="cv-prev">前一句 '+escapeHTML(r.prev.start)+'-'+escapeHTML(r.prev.end)+'s：'+escapeHTML(_cvSplitLine(r.prev.text).line)+'</div>' : "";
    return '<tr'+(r.early?' class="cv-early"':"")+'>'+
      '<td class="cv-n">'+ref(r)+(grouped&&r.it._batch?' <span class="hl-batch">'+escapeHTML(r.it._batch)+'批</span>':"")+'<div class="cv-who">'+escapeHTML(r.it["客户简称"]||r.it["拓品品类名称"]||"")+'</div></td>'+
      '<td class="cv-t">'+_hlFmtSec(r.peak.ms)+'<div class="cv-v">点击 '+escapeHTML(r.peak.value)+'</div>'+(r.early?'<div class="cv-flag">开头即点击</div>':"")+'</td>'+
      '<td>'+(r.cur ? '<div class="cv-line">'+escapeHTML(r.cur.start)+'-'+escapeHTML(r.cur.end)+'s：'+escapeHTML(s.line)+'</div>'+prev : '<span class="hl-muted">无可对齐的分段脚本</span>')+'</td>'+
      '<td class="cv-who2">'+escapeHTML(s.who || "—")+'</td>'+
      '<td class="cv-why">'+escapeHTML(r.reason || "—")+'</td></tr>';
  };
  return '<div class="cv-box">'+
    '<h3>🎯 转化点分析：点击峰值时在说什么、画面是什么</h3>'+
    '<div class="hl-note">基于 '+_cvPayload.filter(r=>!r.early).length+' 条素材「点击」曲线最高点那一秒的台词、讲述者/镜头和已有转化解读归纳'+(grouped?"，并对比各批":"")+'；开头 1s 内的峰值（进入即点击）不参与归纳。</div>'+
    '<div id="cvAi" class="cv-ai"><div class="hl-muted">正在归纳转化点…</div></div>'+
    '<details class="cv-detail"><summary>逐条明细（'+ok.length+' 条：峰值秒、台词、讲述者、解读）</summary>'+
    '<div class="cv-wrap"><table class="cv-table">'+
      '<thead><tr><th>素材</th><th>峰值</th><th>峰值时台词</th><th>画面 / 讲述者</th><th>解读（转化原因）</th></tr></thead>'+
      '<tbody>'+ok.slice().sort((a,b)=>(a.early?1:0)-(b.early?1:0)||(b.peak.value-a.peak.value)).map(tr).join("")+'</tbody>'+
    '</table></div>'+
    (noPeak.length ? '<div class="hl-note" style="margin-top:6px">无点击峰值（点击全为 0）：'+noPeak.map(ref).join(" ")+'</div>' : "")+
    '</details>'+
  '</div>';
}
// 静态版没有后端：转化点归纳结果在导出时内联进 CONV_MD，这里直接渲染。
function _cvRenderStatic(){
  const host = document.getElementById("cvAi");
  if(!host) return;
  if(typeof CONV_MD !== "undefined" && CONV_MD){
    host.innerHTML = marked.parse(String(CONV_MD).replace(/</g,"&lt;")) +
      '<div class="cv-foot">模型归纳 · 已内联（静态分享版）</div>';
  }else if(_cvPayload.filter(r=>!r.early).length < 2){
    host.innerHTML = '<div class="hl-muted">可归纳的点击峰值不足 2 条，见下方逐条明细。</div>';
  }else{
    host.innerHTML = '<div class="hl-muted">本批次尚未生成转化点归纳。</div>';
  }
}

function renderHighlightSection(items){
  const withHl = (items||[]).filter(it => (((it.highlight||{}).series)||[]).length >= 2);
  if(!withHl.length) return;
  const byMd5 = {}, byIdx = {};
  withHl.forEach(it=>{ if(it.md5) byMd5[String(it.md5).toLowerCase()] = it; });
  // 公网封面被内联成 base64 data URI，取不到 md5，用 #N 序号兜底映射
  (items||[]).forEach((it,i)=>{ byIdx[String(it._ref_idx || (i+1))] = it; });
  const hasSeries = it => (((it.highlight||{}).series)||[]).length >= 2;
  // 1) 悬停 #N chip（含封面）→ 弹高光浮层
  const content = document.getElementById("content");
  content.querySelectorAll("a.ref, span.ref").forEach(chip=>{
    let md5 = "";
    const img = chip.querySelector("img.ref-thumb");
    if(img){ const m = (img.getAttribute("src")||"").match(/([0-9a-f]{32})/i); if(m) md5 = m[1].toLowerCase(); }
    let it = md5 ? byMd5[md5] : null;
    if(!it){
      const numEl = chip.querySelector(".ref-num");
      const nm = numEl ? (numEl.textContent||"").trim().match(/^#(\d+)$/) : null;
      const cand = nm ? byIdx[nm[1]] : null;
      if(cand && hasSeries(cand)) it = cand;
    }
    if(!it) return;
    chip.classList.add("hl-hoverable");
    chip.addEventListener("mouseenter", ()=>_hlQueuePopover(chip, it));
    chip.addEventListener("mouseleave", ()=>_hlHidePopover());
  });
  // 2) 底部保留完整高光区（转化点分析 + 逐条曲线卡）
  let convHtml = "";
  try { convHtml = _hlConversionHTML(withHl); } catch(e){ console.warn("conversion render failed", e); }
  const sec = document.createElement("section");
  sec.className = "hl-section";
  sec.innerHTML = '<h2 style="border-left:3px solid #4f8cff;padding-left:10px;margin:28px 0 14px">'+
      '📈 高光时序数据 &amp; 转化点（基于真实播放进度）</h2>'+
    '<div class="hl-note">悬停正文里的素材封面（#N）即可弹出对应高光图；下方逐条高光图默认折叠，点开查看。曲线与完整脚本双向联动：悬停曲线看该秒数值并高亮脚本句，悬停脚本句在曲线上定位。仅对带「账户ID + md5」的素材可拉取。</div>'+
    convHtml+
    '<details class="hl-fold"><summary>📊 逐条素材高光图（'+withHl.length+' 条，点开查看）</summary>'+
    '<div class="hl-grid">'+withHl.map(_hlCardHTML).join("")+'</div></details>';
  content.appendChild(sec);
  sec.querySelectorAll(".hl-card").forEach(c=>_wireHlCard(c, items));
  _cvRenderStatic();
}

document.addEventListener("DOMContentLoaded", function(){
  marked.setOptions({gfm: true, breaks: false});
  const html = marked.parse(REPORT_MD || "");
  document.getElementById("content").innerHTML = replaceHashRefs(html, ITEMS || []);
  try { renderHighlightSection(ITEMS || []); } catch(e){ console.warn("highlight render failed", e); }
  try {
    if(window.AdhocOpenType) AdhocOpenType.createUI({
      doc: document, getItems: () => ITEMS || [],
      bar: document.getElementById("otBar"), section: null,   /* 与内网版一致：不再展示「素材开篇类型一览」 */
      content: document.getElementById("content"), coverOf: it => it._cover_url || "",
    }).render();
  } catch(e){ console.warn("open-type filter failed", e); }
  try {
    if(window.AdhocFW && typeof FW_DATA !== "undefined" && FW_DATA)
      AdhocFW.init({bid: "", items: ITEMS || [], meta: {mode: FW_MODE}, el: document.getElementById("fwSection"), data: FW_DATA});
  } catch(e){ console.warn("fw section failed", e); }
  try { if(window.AdhocTOC) AdhocTOC.init({top: 24}); } catch(e){ console.warn("toc failed", e); }
});
</script>
</body>
</html>
